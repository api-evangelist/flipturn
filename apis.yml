aid: flipturn
name: Flipturn
description: >-
  Flipturn is an EV charging management platform that gives businesses and fleet
  operators one system to monitor chargers, manage energy costs, run fleet
  charging operations, control access, and handle payments and billing. Its
  software layer sits on top of OCPP 1.6 and 2.0.1 chargers (with OCPI support
  for roaming partners) and serves delivery fleets, transit agencies,
  multifamily housing, dealerships, workplaces, hospitality, retail, parking,
  and valet. Flipturn also publishes a JSON REST API, secured with a bearer API
  key, that exposes sites, chargers and ports, charging sessions, charger health
  and uptime, access IDs (RFID cards and vehicles), vehicles, alerts, charger
  errors, raw OCPP messages, port reservations, site power limits, vehicle
  departure times, and maintenance windows — designed for integrating charging
  data with ticketing platforms, data warehouses, and transportation management
  systems. Flipturn is backed by Accel and CRV.
